<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/video-p2p/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoP2P — Edit & Share Videos in Browser</title>
    <script>
    // Cross-Origin Isolation Service Worker
    // Injects COOP/COEP headers at browser level for SharedArrayBuffer.
    // On GitHub Pages the CDN strips these headers, so a Service Worker
    // re-adds them after the CDN delivers the response.
    //
    // First visit: register SW -> if still not isolated, reload to activate.
    // Subsequent visits: SW controls the page, isolation is immediate.
    (function() {
      // Already isolated — nothing to do
      if (crossOriginIsolated) return;
      if (!('serviceWorker' in navigator)) return;

      var script = '/video-p2p/coi-serviceworker.js';
      navigator.serviceWorker.register(script).then(function() {
        // Registration succeeded but we may not be isolated yet — the SW
        // hasn't claimed this page. Reload so the SW intercepts the next
        // request and injects COOP/COEP headers.
        if (!crossOriginIsolated) {
          window.location.reload();
        }
      }).catch(function() {
        // SW registration failed — React will detect missing cross-origin
        // isolation and show an appropriate error message.
      });
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
