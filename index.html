<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/video-p2p/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoP2P — Edit & Share Videos in Browser</title>
    <script>
    // Cross-Origin Isolation Service Worker
    // Injects COOP/COEP headers at browser level for SharedArrayBuffer.
    // On GitHub Pages the CDN strips these headers, so a Service Worker
    // re-adds them after the CDN delivers the response.
    //
    // Pattern: detect missing isolation → register SW → wait for active →
    // reload so SW injects headers on next navigation.
    //
    // Uses getRegistration() instead of sessionStorage guards because:
    // - sessionStorage breaks when SW activation is async and takes
    //   multiple page loads to claim the client (first load sets flag,
    //   second load skips even though still not isolated).
    // - getRegistration() reflects the actual SW lifecycle state.
    (function() {
      if (crossOriginIsolated) return;
      if (!('serviceWorker' in navigator)) return;

      var SW_PATH = '/video-p2p/coi-serviceworker.js';

      // Check if a SW is already registered and controlling this page.
      // getRegistration() returns null if no SW was ever registered for
      // this scope, or a Registration object reflecting current state.
      navigator.serviceWorker.getRegistration().then(function(reg) {
        // If an active SW already controls this client but we're still
        // not isolated, something is fundamentally broken (e.g., the SW
        // isn't injecting headers). Don't infinite-reload — just warn
        // and let React show the error message.
        if (reg && reg.active && navigator.serviceWorker.controller) {
          console.warn(
            'Active COI SW controls this page but crossOriginIsolated=false. ' +
            'The SW may not be injecting COOP/COEP headers correctly.'
          );
          return;
        }

        // Register the COI SW. If there's already a registration in
        // progress, register() returns the existing one (idempotent).
        navigator.serviceWorker.register(SW_PATH).then(function() {
          // register() resolves on install. navigator.serviceWorker.ready
          // waits for the SW to be active AND controlling this client.
          // Only then will the next navigation receive injected headers.
          return navigator.serviceWorker.ready;
        }).then(function() {
          // SW is active and controlling. Reload so the next navigation
          // goes through the SW with COOP/COEP headers injected.
          window.location.reload();
        }).catch(function(err) {
          // SW registration failed. React will detect missing cross-origin
          // isolation and show an appropriate error message.
          console.error('COI SW setup failed:', err);
        });
      });
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
