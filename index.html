<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/video-p2p/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoP2P — Edit & Share Videos in Browser</title>
    <script>
    // Cross-Origin Isolation Service Worker
    // Injects COOP/COEP headers at browser level for SharedArrayBuffer.
    // On first visit: register SW, reload once to activate it.
    (function() {
      if ('serviceWorker' in navigator && !sessionStorage.getItem('coi-done')) {
        sessionStorage.setItem('coi-done', '1');
        navigator.serviceWorker.register('/video-p2p/coi-serviceworker.js')
          .then(function(reg) {
            if (reg.active && !navigator.serviceWorker.controller) {
              window.location.reload();
            }
          })
          .catch(function() {
            // SW registration failed — clear flag, React will detect
            // missing cross-origin isolation and show an error message
            sessionStorage.removeItem('coi-done');
          });
      }
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
